<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iPadでのピンチズームやダブルタップズームを防止し、アプリのように固定する設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>がっこう タイマー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* アニメーション設定 */
    @keyframes wiggle {
      0%, 100% { transform: rotate(-5deg) translateY(-60%); }
      50% { transform: rotate(5deg) translateY(-70%); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dangerFlash {
      0%, 100% { background-color: #ffffff; }
      50% { background-color: #ef4444; }
    }
    .animate-wiggle { animation: wiggle 0.5s ease-in-out infinite; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-danger-flash { animation: dangerFlash 2s ease-in-out infinite; }
    
    /* タッチ操作の最適化 */
    button { touch-action: manipulation; }
  </style>
</head>
<body class="min-h-screen w-full overflow-x-hidden select-none bg-slate-100 font-sans">
  
  <div id="app-container" class="min-h-screen w-full max-w-7xl mx-auto transition-colors duration-500 p-4 md:p-6 flex flex-col items-center justify-center relative">
    
    <!-- メインカード -->
    <div id="main-card" class="w-full flex flex-col justify-between rounded-[2rem] shadow-xl p-6 md:p-8 border-4 relative overflow-hidden transition-colors duration-500 gap-6">
      
      <!-- 終了時のフラッシュエフェクト -->
      <div id="finish-overlay" class="absolute inset-0 bg-yellow-100/40 pointer-events-none flex items-center justify-center animate-pulse z-0 hidden"></div>

      <!-- [上部] ヘッダーエリア (タイマー切り替えメニューが背後に隠れないよう z-40 に引き上げ) -->
      <div class="w-full flex justify-between items-center z-40 shrink-0 relative">
        <button id="btn-sound" class="p-3 bg-slate-100 hover:bg-slate-200 rounded-xl md:rounded-2xl transition-all text-slate-600 active:scale-95 text-base md:text-lg font-bold">
          🔊 おとあり
        </button>

        <!-- タイマー切り替えが可能なヘッダータイトル -->
        <div id="header-title-trigger" class="flex items-center space-x-2 text-blue-500 cursor-pointer bg-blue-50 hover:bg-blue-100 active:scale-95 px-4 py-2 rounded-2xl border-2 border-dashed border-blue-200 transition-all select-none">
          <span class="text-2xl animate-pulse hidden md:block">✨</span>
          <h1 id="header-title" class="text-2xl md:text-4xl lg:text-5xl font-black tracking-wider text-slate-800 flex items-center gap-2">
            <span>おそうじ タイマー</span>
            <span class="text-xl md:text-2xl text-blue-500">▼</span>
          </h1>
          <span class="text-2xl animate-pulse hidden md:block">✨</span>
        </div>

        <!-- タイマー選択ドロップダウンメニュー (確実に一番手前に来るよう z-[100] に設定) -->
        <div id="timer-select-dropdown" class="hidden absolute top-20 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md border-4 border-blue-400 rounded-2xl shadow-2xl p-4 z-[100] w-80 flex flex-col gap-3 animate-float">
          <div class="text-center font-bold text-slate-500 text-sm border-b pb-2">タイマーをえらんでね</div>
          <button id="select-cleaning" class="w-full py-4 bg-blue-500 hover:bg-blue-600 text-white font-black text-xl rounded-xl transition-all shadow-md active:scale-95">
            🧹 おそうじ タイマー
          </button>
          <button id="select-leaving" class="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white font-black text-xl rounded-xl transition-all shadow-md active:scale-95">
            🎒 かえりのしたく
          </button>
        </div>

        <button id="btn-settings" class="p-3 rounded-xl md:rounded-2xl transition-all active:scale-95 text-base md:text-lg font-bold bg-slate-100 hover:bg-slate-200 text-slate-600">
          ⚙️ せってい
        </button>
      </div>

      <!-- 設定パネル（オーバーレイ表示） -->
      <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/20 backdrop-blur-sm p-4">
        <div class="w-full max-w-3xl bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border-4 border-slate-200 p-6 animate-float flex flex-col max-h-full overflow-y-auto">
          <div class="flex items-center gap-2 border-b-2 pb-3 mb-4 w-full justify-center">
            <span class="font-black text-slate-700 text-2xl">⚙️ タイマーの時間をえらぶ</span>
          </div>
          
          <!-- 1〜30分の設定UI -->
          <div id="duration-settings-container" class="flex flex-col items-center w-full mb-6">
            <div class="flex items-center justify-center gap-6 md:gap-12 w-full">
              <button id="btn-decrease" class="w-16 h-16 md:w-20 md:h-20 bg-slate-200 rounded-full text-4xl md:text-5xl font-black text-slate-600 hover:bg-slate-300 active:scale-95 transition-all flex items-center justify-center shadow-sm">－</button>
              <div class="text-center w-32 md:w-48">

                <span id="setting-reading" class="text-xl md:text-3xl font-bold text-slate-500 block mt-1">ふん</span>

              <button id="btn-increase" class="w-16 h-16 md:w-20 md:h-20 bg-blue-500 rounded-full text-4xl md:text-5xl font-black text-white hover:bg-blue-600 active:scale-95 transition-all flex items-center justify-center shadow-lg">＋</button>
            </div>
            
            <div class="flex flex-wrap justify-center gap-3 mt-8">
              <button class="shortcut-btn px-4 py-3 bg-slate-100 rounded-2xl text-lg md:text-xl font-bold text-slate-600 hover:bg-slate-200 active:scale-95 transition-all border-2 border-transparent" data-min="5">5ふん</button>
              <button class="shortcut-btn px-4 py-3 bg-slate-100 rounded-2xl text-lg md:text-xl font-bold text-slate-600 hover:bg-slate-200 active:scale-95 transition-all border-2 border-transparent" data-min="10">10ぷん</button>
              <button class="shortcut-btn px-4 py-3 bg-slate-100 rounded-2xl text-lg md:text-xl font-bold text-slate-600 hover:bg-slate-200 active:scale-95 transition-all border-2 border-transparent" data-min="15">15ふん</button>
              <button class="shortcut-btn px-4 py-3 bg-slate-100 rounded-2xl text-lg md:text-xl font-bold text-slate-600 hover:bg-slate-200 active:scale-95 transition-all border-2 border-transparent" data-min="20">20ぷん</button>
              <button class="shortcut-btn px-4 py-3 bg-slate-100 rounded-2xl text-lg md:text-xl font-bold text-slate-600 hover:bg-slate-200 active:scale-95 transition-all border-2 border-transparent" data-min="30">30ぷん</button>
            </div>
          </div>

          <div class="border-t-2 border-slate-100 pt-4 flex justify-between items-center flex-wrap gap-4 mt-auto">
            <button id="btn-close-settings" class="text-slate-500 hover:text-slate-700 font-bold text-lg px-6 py-3 bg-slate-100 rounded-xl">

            </button>
            <button id="btn-demo" class="inline-flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl font-bold text-base transition-all shadow-md">
              <span>⏱️ 先生用：高速テスト(100倍速)</span>
            </button>
          </div>
        </div>
      </div>

      <!-- [中央] タイマーとコントロールボタン -->
      <div class="flex flex-col md:flex-row items-center justify-center gap-6 lg:gap-12 w-full py-2 z-10">
        
        <!-- デジタルタイマー -->
        <div class="flex flex-col items-center shrink-0">
          <div class="text-base md:text-lg font-black text-slate-500 uppercase tracking-widest mb-2 flex items-center gap-2 bg-white/80 px-4 py-1.5 rounded-full shadow-sm">
            <span>⏱️</span> のこりじかん
          </div>
          <div id="timer-container" class="bg-slate-900 px-6 lg:px-12 py-3 lg:py-4 rounded-3xl shadow-inner border-4 border-slate-800 flex items-baseline justify-center font-mono select-none transition-colors duration-300">
            <span id="timer-m" class="text-6xl lg:text-8xl font-black tracking-widest leading-none drop-shadow-md">15</span>
            <span id="timer-colon" class="text-5xl lg:text-7xl font-black mx-3 pb-2 leading-none">:</span>
            <span id="timer-s" class="text-6xl lg:text-8xl font-black tracking-widest leading-none drop-shadow-md">00</span>
          </div>
        </div>

        <!-- コントロールボタン -->
        <div class="flex flex-col items-center justify-center gap-4 shrink-0 w-full md:w-[220px] lg:w-[260px]">
          <!-- スタートボタン (初期状態) -->
          <button id="btn-start" class="w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white py-4 lg:py-6 rounded-[2rem] text-2xl lg:text-3xl font-black shadow-xl active:scale-95 transition-transform">
            <span>▶ スタート</span>
          </button>

          <!-- 一時停止ボタン -->
          <button id="btn-pause" class="hidden w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white py-4 lg:py-6 rounded-[2rem] text-2xl lg:text-3xl font-black shadow-xl active:scale-95 transition-transform">
            <span>‖ 一時停止</span>
          </button>

          <!-- 再開(さいかい)ボタン -->
          <button id="btn-resume" class="hidden w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white py-4 lg:py-6 rounded-[2rem] text-2xl lg:text-3xl font-black shadow-xl active:scale-95 transition-transform">
            <span>▶ さいかい</span>
          </button>
          
          <!-- リセット(やめる)ボタン -->
          <button id="btn-reset" class="hidden w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-slate-500 to-slate-600 hover:from-slate-600 hover:to-slate-700 text-white py-3 lg:py-4 rounded-[1.5rem] text-xl lg:text-2xl font-bold shadow-md active:scale-95 transition-transform">
            <span>■ リセット</span>
          </button>
          
          <!-- 先生用：終了予想時刻 -->
          <div id="finish-time-container" class="hidden w-full text-center text-slate-500 text-xs lg:text-sm bg-white border-2 border-slate-100 rounded-xl px-3 py-2 font-bold shadow-sm">
            <div class="flex items-center justify-center gap-2 mb-1">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>終了予想時刻</span>
            </div>
            <strong id="finish-time-text" class="text-slate-800 text-xl lg:text-2xl">--:--</strong>
          </div>
        </div>

      </div>

      <!-- [下部] 吹き出しメッセージ -->
      <div class="w-full flex items-center justify-center z-10 shrink-0">
        <div class="bg-white/95 rounded-2xl border-4 border-slate-200 px-6 py-3 shadow-md relative w-11/12 max-w-4xl text-center">
          <p id="message-text" class="text-2xl lg:text-4xl font-black transition-all duration-300">
            じかんをえらんで「スタート」してね！
          </p>
          <div class="absolute -bottom-3 left-1/2 transform -translate-x-1/2 w-6 h-6 bg-white border-r-4 border-b-4 border-slate-200 rotate-45"></div>
        </div>
      </div>

      <!-- [最下部] ゲージとゾウさん（メーター部分） -->

        <div class="relative w-full">
          
          <!-- スタート/ゴールラベル -->
          <div class="absolute left-0 top-0 text-sm lg:text-base font-black text-slate-400 transform -translate-y-8 -translate-x-1">
            🏠 スタート
          </div>
          <div class="absolute right-0 top-0 text-4xl lg:text-6xl z-50 transform -translate-y-12 lg:-translate-y-14 translate-x-2 lg:translate-x-4 animate-bounce">
            🏁
            <span class="absolute -top-4 right-0 text-xs lg:text-sm font-black text-red-500 bg-white px-2 py-0.5 rounded-full border-2 border-red-200 shadow-sm whitespace-nowrap">
              ゴール！
            </span>
          </div>

          <!-- キャラクター（ゾウさん or クマさん） -->
          <div id="elephant-container" class="absolute top-0 z-30 animate-float" style="left: calc(0% - 2rem); transform: translateY(-50%);">
            <div class="text-5xl lg:text-7xl select-none flex flex-col items-center">
              <span id="elephant-text" class="inline-block transform scale-x-[-1] drop-shadow-lg">🐘</span>
            </div>
            <div id="dust-effect" class="hidden absolute -bottom-1 -left-2 text-2xl animate-ping opacity-60">💨</div>
          </div>

          <!-- メーター本体 -->
          <div class="w-full h-[60px] lg:h-[80px] bg-slate-200 rounded-full p-2 lg:p-3 shadow-inner relative overflow-hidden flex items-center justify-end">
            
            <div id="progress-bar" class="h-full rounded-full shadow-lg relative z-10 flex items-center" style="width: 100%;">
              <div class="w-full h-1/2 bg-white/20 absolute top-0 rounded-t-full"></div>
            </div>

            <!-- 1分ごとの区切り線 -->
            <div id="dividers-container" class="absolute inset-0 py-2 lg:py-3 px-3 flex justify-evenly items-center z-20 pointer-events-none">
              <!-- JSで動的に生成 -->
            </div>
          </div>

          <!-- ゲージ下の補助テキスト -->
          <div class="w-full flex justify-between px-2 mt-3 text-sm lg:text-base font-black text-slate-400">
            <span>おわり</span>
            <span id="duration-display" class="text-slate-500 bg-slate-200 px-4 py-1 rounded-full">おそうじタイム： 15ふん</span>
            <span>はじめ</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // State
    let currentMode = 'cleaning'; // 'cleaning' (おそうじ) または 'leaving' (かえりのしたく)
    let isStarted = false;       // タイマーが起動状態にあるか (一時停止中も含む)
    let isActive = false;        // カウントダウンが「稼働中」か
    let durationMinutes = 15;
    let remainingTimeMs = 15 * 60 * 1000;
    let endTime = null;
    let isFinished = false;
    let soundEnabled = true;
    let isDemoMode = false;
    let timerInterval = null;
    let wakeLock = null;         // 画面スリープ防止用

    // かえりのしたく用メッセージ候補 (20秒おきに自動ループ)
    const leavingMessages = [
      "つくえを せいとん しよう！🏫",
      "はくいぼう は もった？🥋",
      "すいとうは もった？🍼",
      "ゴミを3つひろおう！🧹"
    ];

    // DOM Elements
    const appContainer = document.getElementById('app-container');
    const mainCard = document.getElementById('main-card');
    const finishOverlay = document.getElementById('finish-overlay');
    const btnSound = document.getElementById('btn-sound');
    const btnSettings = document.getElementById('btn-settings');
    const settingsModal = document.getElementById('settings-modal');
    const btnCloseSettings = document.getElementById('btn-close-settings');
    const btnDemo = document.getElementById('btn-demo');
    const timerContainer = document.getElementById('timer-container');
    const timerM = document.getElementById('timer-m');
    const timerS = document.getElementById('timer-s');
    const timerColon = document.getElementById('timer-colon');
    const messageText = document.getElementById('message-text');
    const elephantContainer = document.getElementById('elephant-container');
    const elephantText = document.getElementById('elephant-text');
    const dustEffect = document.getElementById('dust-effect');
    const progressBar = document.getElementById('progress-bar');
    const dividersContainer = document.getElementById('dividers-container');
    const durationDisplay = document.getElementById('duration-display');
    
    // タイマー切り替え用の要素
    const headerTitleTrigger = document.getElementById('header-title-trigger');
    const headerTitle = document.getElementById('header-title');
    const timerSelectDropdown = document.getElementById('timer-select-dropdown');
    const selectCleaning = document.getElementById('select-cleaning');
    const selectLeaving = document.getElementById('select-leaving');

    // コントロールボタン群
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');
    const btnReset = document.getElementById('btn-reset');
    
    const finishTimeContainer = document.getElementById('finish-time-container');
    const finishTimeText = document.getElementById('finish-time-text');

    // 新規追加の設定UI用Elements
    const btnDecrease = document.getElementById('btn-decrease');
    const btnIncrease = document.getElementById('btn-increase');
    const settingDurationText = document.getElementById('setting-duration');
    const settingReadingText = document.getElementById('setting-reading');
    const shortcutBtns = document.querySelectorAll('.shortcut-btn');

    // Themes (React版と同様)
    const themes = {
      finished: {
        bar: 'bg-emerald-500', text: 'text-emerald-700', bg: 'bg-emerald-300', cardBg: 'bg-emerald-50', border: 'border-emerald-100', character: '👑🐘✨', timerText: 'text-emerald-400', timerColon: 'text-emerald-600'
      },
      danger: {
        bar: 'bg-red-500 animate-pulse', text: 'text-red-800 font-extrabold', bg: 'animate-danger-flash', cardBg: 'bg-transparent', border: 'border-red-500', character: '🏃🐘💨', timerText: 'text-red-400', timerColon: 'text-red-600'
      },
      warning: {
        bar: 'bg-amber-400', text: 'text-amber-800 font-bold', bg: 'bg-amber-400', cardBg: 'bg-amber-50', border: 'border-amber-200', character: '🧹🐘', timerText: 'text-amber-300', timerColon: 'text-amber-500'
      },
      normal: {
        bar: 'bg-green-400', text: 'text-green-800 font-bold', bg: 'bg-green-400', cardBg: 'bg-green-50', border: 'border-green-200', character: '🐘', timerText: 'text-emerald-400', timerColon: 'text-emerald-600'
      },
      // かえりのしたく時のキャラクター切り替え用 (テーマカラーは同じだが、動作時の絵文字を変える)
      finishedLeaving: {
        bar: 'bg-emerald-500', text: 'text-emerald-700', bg: 'bg-emerald-300', cardBg: 'bg-emerald-50', border: 'border-emerald-100', character: '👑🐻🎒✨', timerText: 'text-emerald-400', timerColon: 'text-emerald-600'
      },
      dangerLeaving: {
        bar: 'bg-red-500 animate-pulse', text: 'text-red-800 font-extrabold', bg: 'animate-danger-flash', cardBg: 'bg-transparent', border: 'border-red-500', character: '🏃🐻🎒💨', timerText: 'text-red-400', timerColon: 'text-red-600'
      },
      warningLeaving: {
        bar: 'bg-amber-400', text: 'text-amber-800 font-bold', bg: 'bg-amber-400', cardBg: 'bg-amber-50', border: 'border-amber-200', character: '🎒🐻🏡', timerText: 'text-amber-300', timerColon: 'text-amber-500'
      },
      normalLeaving: {
        bar: 'bg-green-400', text: 'text-green-800 font-bold', bg: 'bg-green-400', cardBg: 'bg-green-50', border: 'border-green-200', character: '🐻🎒', timerText: 'text-emerald-400', timerColon: 'text-emerald-600'
      }
    };

    const bgClasses = ['bg-emerald-300', 'animate-danger-flash', 'bg-amber-400', 'bg-green-400'];
    const cardBgClasses = ['bg-emerald-50', 'bg-transparent', 'bg-amber-50', 'bg-green-50'];
    const borderClasses = ['border-emerald-100', 'border-red-500', 'border-amber-200', 'border-green-200'];
    const textClasses = ['text-emerald-700', 'text-red-800', 'text-amber-800', 'text-green-800', 'font-extrabold', 'font-bold'];
    const timerTextClasses = ['text-emerald-400', 'text-red-400', 'text-amber-300'];
    const timerColonClasses = ['text-emerald-600', 'text-red-600', 'text-amber-500'];
    const barClasses = ['bg-emerald-500', 'bg-red-500', 'animate-pulse', 'bg-amber-400', 'bg-green-400'];

    // 状態の自動保存（リロード対策）
    function saveState() {
      const state = {
        currentMode,
        isStarted,
        isActive,
        durationMinutes,
        endTime,
        remainingTimeMs,
        isFinished
      };
      localStorage.setItem('cleaningTimerState', JSON.stringify(state));
    }

    // 状態の復元
    function loadState() {
      const saved = localStorage.getItem('cleaningTimerState');
      if (saved) {
        try {
          const state = JSON.parse(saved);
          if (state.currentMode) {
            currentMode = state.currentMode;
          }
          if (state.durationMinutes) {
            durationMinutes = state.durationMinutes;
          }
          isFinished = state.isFinished || false;
          
          if (state.isStarted) {
            isStarted = true;
            if (state.isActive && state.endTime) {
              const now = Date.now();
              if (now < state.endTime) {
                isActive = true;
                endTime = state.endTime;
                remainingTimeMs = state.endTime - now;
                startTimerLoop();
              } else {
                isStarted = false;
                isActive = false;
                isFinished = true;
                remainingTimeMs = 0;
              }
            } else {
              isActive = false;
              remainingTimeMs = state.remainingTimeMs || (durationMinutes * 60 * 1000);
            }
          } else {
            isStarted = false;
            isActive = false;
            remainingTimeMs = durationMinutes * 60 * 1000;
            if (isFinished) remainingTimeMs = 0;
          }
        } catch(e) {
          console.error('状態の復元に失敗しました', e);
        }
      }
    }

    // 画面スリープの防止 (Wake Lock API)
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
          console.warn('Wake Lock request failed:', err);
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isActive) {
        requestWakeLock();
      }
    });

    // 音声チャイム
    function playFinishedChime() {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        const playNote = (freq, startTime, duration) => {
          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);
          
          gainNode.gain.setValueAtTime(0.2, startTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.02);
          
          osc.connect(gainNode);
          gainNode.connect(ctx.destination);
          
          osc.start(startTime);
          osc.stop(startTime + duration);
        };

        const now = ctx.currentTime;
        playNote(523.25, now, 0.25);
        playNote(659.25, now + 0.15, 0.25);
        playNote(783.99, now + 0.30, 0.25);
        playNote(1046.50, now + 0.45, 0.8);
      } catch (e) {
        console.warn("Audio Context could not play:", e);
      }
    }

    // タイマーメインループ
    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      
      const speedMultiplier = isDemoMode ? 100 : 1;
      
      timerInterval = setInterval(() => {
        const now = Date.now();
        let nextRemaining = (endTime - now) * speedMultiplier;
        
        if (!isDemoMode) {
          nextRemaining = endTime - now;
        }

        if (nextRemaining <= 0) {
          remainingTimeMs = 0;
          isActive = false;
          isStarted = false;
          isFinished = true;
          playFinishedChime();
          clearInterval(timerInterval);
          releaseWakeLock(); 
          saveState();       
        } else {
          remainingTimeMs = nextRemaining;
        }
        updateUI();
      }, 100);
    }

    // 分の読み方を判定する関数 (1年生の読み方に準拠)
    function getMinuteReading(min) {
      const lastDigit = min % 10;
      if (min === 10 || min === 20 || min === 30 || [1, 3, 4, 6, 8].includes(lastDigit)) {
        return 'ぷん';
      }
      return 'ふん';
    }

    // 設定画面のUI更新
    function updateSettingUI() {
      settingDurationText.textContent = durationMinutes;
      settingReadingText.textContent = getMinuteReading(durationMinutes);
      
      btnDecrease.style.opacity = durationMinutes <= 1 ? '0.5' : '1';
      btnDecrease.style.pointerEvents = durationMinutes <= 1 ? 'none' : 'auto';
      
      btnIncrease.style.opacity = durationMinutes >= 30 ? '0.5' : '1';
      btnIncrease.style.pointerEvents = durationMinutes >= 30 ? 'none' : 'auto';

      shortcutBtns.forEach(btn => {
        const min = parseInt(btn.dataset.min);
        if (min === durationMinutes) {
          btn.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-300');
          btn.classList.remove('bg-slate-100', 'text-slate-600', 'border-transparent');
        } else {
          btn.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-300');
          btn.classList.add('bg-slate-100', 'text-slate-600', 'border-transparent');
        }
      });
    }

    // 設定変更
    function changeDuration(minutes) {
      durationMinutes = minutes;
      remainingTimeMs = minutes * 60 * 1000;
      isActive = false;
      isStarted = false;
      isFinished = false;
      isDemoMode = false;
      clearInterval(timerInterval);
      releaseWakeLock();
      saveState(); 
      updateSettingUI();
      updateDividers();
      updateUI();
    }

    // ボタンクリックイベント類
    btnDecrease.addEventListener('click', () => {
      if (durationMinutes > 1) changeDuration(durationMinutes - 1);
    });

    btnIncrease.addEventListener('click', () => {
      if (durationMinutes < 30) changeDuration(durationMinutes + 1);
    });

    shortcutBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const min = parseInt(e.target.dataset.min);
        changeDuration(min);
      });
    });

    // タイマーモード切り替えメニュー
    headerTitleTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = timerSelectDropdown.classList.contains('hidden');
      if (isHidden) {
        timerSelectDropdown.classList.remove('hidden');
      } else {
        timerSelectDropdown.classList.add('hidden');
      }
    });

    document.addEventListener('click', () => {
      timerSelectDropdown.classList.add('hidden');
    });

    selectCleaning.addEventListener('click', () => {
      currentMode = 'cleaning';
      timerSelectDropdown.classList.add('hidden');
      changeDuration(durationMinutes); // 時間リセットとUI更新
    });

    selectLeaving.addEventListener('click', () => {
      currentMode = 'leaving';
      timerSelectDropdown.classList.add('hidden');
      changeDuration(durationMinutes); // 時間リセットとUI更新
    });

    // スタートボタン
    btnStart.addEventListener('click', () => {
      isFinished = false;
      isDemoMode = false; 
      settingsModal.classList.add('hidden');
      btnSettings.classList.replace('bg-blue-100', 'bg-slate-100');
      btnSettings.classList.replace('text-blue-600', 'text-slate-600');
      
      endTime = Date.now() + (durationMinutes * 60 * 1000);
      remainingTimeMs = durationMinutes * 60 * 1000;
      isActive = true;
      isStarted = true;
      requestWakeLock(); 
      saveState();       
      startTimerLoop();
      updateUI();
    });

    // 一時停止ボタン
    btnPause.addEventListener('click', () => {
      isActive = false;
      clearInterval(timerInterval);
      releaseWakeLock(); 
      saveState();       
      updateUI();
    });

    // 再開(さいかい)ボタン
    btnResume.addEventListener('click', () => {
      isActive = true;
      endTime = Date.now() + remainingTimeMs;
      requestWakeLock();
      saveState();
      startTimerLoop();
      updateUI();
    });

    // リセットボタン（初期状態へ戻る）
    btnReset.addEventListener('click', () => {
      isActive = false;
      isStarted = false;
      isDemoMode = false;
      remainingTimeMs = durationMinutes * 60 * 1000;
      clearInterval(timerInterval);
      releaseWakeLock(); 
      saveState();       
      updateUI();
    });

    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      btnSound.innerHTML = soundEnabled ? "🔊 おとあり" : "🔇 おとなし";
    });

    btnSettings.addEventListener('click', () => {
      const isHidden = settingsModal.classList.contains('hidden');
      if (isHidden) {
        settingsModal.classList.remove('hidden');
        btnSettings.classList.replace('bg-slate-100', 'bg-blue-100');
        btnSettings.classList.replace('text-slate-600', 'text-blue-600');
      } else {
        settingsModal.classList.add('hidden');
        btnSettings.classList.replace('bg-blue-100', 'bg-slate-100');
        btnSettings.classList.replace('text-blue-600', 'text-slate-600');
      }
    });

    btnCloseSettings.addEventListener('click', () => {
      settingsModal.classList.add('hidden');
      btnSettings.classList.replace('bg-blue-100', 'bg-slate-100');
      btnSettings.classList.replace('text-blue-600', 'text-slate-600');
    });

    btnDemo.addEventListener('click', () => {
      isFinished = false;
      isDemoMode = true;
      endTime = Date.now() + ((durationMinutes * 60 * 1000) / 100);
      remainingTimeMs = durationMinutes * 60 * 1000;
      isActive = true;
      isStarted = true;
      settingsModal.classList.add('hidden');
      requestWakeLock(); 
      startTimerLoop();
      updateUI();
    });

    // ゲージの区切り線の生成
    function updateDividers() {
      dividersContainer.innerHTML = '';
      const dividerCount = durationMinutes - 1;
      if (dividerCount <= 0) return;

      for (let i = 0; i < dividerCount; i++) {
        const div = document.createElement('div');
        if (durationMinutes > 20) {
          div.className = 'h-full w-1 md:w-1.5 bg-white/90 shadow-sm rounded-full mix-blend-overlay';
        } else {
          div.className = 'h-full w-1.5 md:w-2.5 bg-white/90 shadow-sm rounded-full mix-blend-overlay';
        }
        dividersContainer.appendChild(div);
      }
    }

    // ユーティリティ関数
    function formatTimer(ms) {
      const safeMs = Math.max(0, ms); 
      const totalSeconds = Math.ceil(safeMs / 1000);
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');
      return { m, s };
    }

    // 終了時間を表示用フォーマット
    function getTargetFinishTime() {
      if (!isActive || isFinished) return "--:--";
      const finishDate = new Date(Date.now() + remainingTimeMs);
      const h = finishDate.getHours().toString().padStart(2, '0');
      const m = finishDate.getMinutes().toString().padStart(2, '0');
      return `${h}:${m}`;
    }

    function removeClasses(element, classArray) {
      classArray.forEach(cls => {
        cls.split(' ').forEach(c => element.classList.remove(c));
      });
    }

    function addClasses(element, classesString) {
      classesString.split(' ').forEach(c => {
        if(c) element.classList.add(c);
      });
    }

    // UIの描画更新
    function updateUI() {
      const totalDurationMs = durationMinutes * 60 * 1000;
      const percentage = Math.max(0, Math.min(100, (remainingTimeMs / totalDurationMs) * 100));
      const elephantPosition = 100 - percentage;
      const remainingMinutes = remainingTimeMs / (60 * 1000);
      
      const remainingMinCeil = Math.ceil(remainingTimeMs / (60 * 1000));

      // 現在のタイマー種別にあわせたモード名をヘッダーに描画
      if (currentMode === 'cleaning') {
        headerTitle.innerHTML = '<span>おそうじ タイマー</span> <span class="text-xl md:text-2xl text-blue-500">▼</span>';
        durationDisplay.textContent = `おそうじタイム： ${durationMinutes}${getMinuteReading(durationMinutes)}`;
      } else {
        headerTitle.innerHTML = '<span>かえりのしたく</span> <span class="text-xl md:text-2xl text-amber-500">▼</span>';
        durationDisplay.textContent = `したくタイム： ${durationMinutes}${getMinuteReading(durationMinutes)}`;
      }

      // テーマ判定 (現在のタイマーの種類に応じてゾウとクマを出し分け)
      let theme;
      if (currentMode === 'cleaning') {
        if (isFinished) theme = themes.finished;
        else if (isStarted && !isActive) theme = themes.warning;
        else if (remainingMinutes <= 3) theme = themes.danger;
        else if (remainingMinutes <= 7) theme = themes.warning;
        else theme = themes.normal;
      } else {
        // かえりのしたく用の絵文字
        if (isFinished) theme = themes.finishedLeaving;
        else if (isStarted && !isActive) theme = themes.warningLeaving;
        else if (remainingMinutes <= 3) theme = themes.dangerLeaving;
        else if (remainingMinutes <= 7) theme = themes.warningLeaving;
        else theme = themes.normalLeaving;
      }

      removeClasses(appContainer, bgClasses);
      addClasses(appContainer, theme.bg);

      removeClasses(mainCard, cardBgClasses);
      addClasses(mainCard, theme.cardBg);

      removeClasses(mainCard, borderClasses);
      addClasses(mainCard, theme.border);

      if (isFinished) finishOverlay.classList.remove('hidden');
      else finishOverlay.classList.add('hidden');

      // タイマー更新
      const timeParts = formatTimer(remainingTimeMs);
      timerM.textContent = timeParts.m;
      timerS.textContent = timeParts.s;

      removeClasses(timerContainer, timerTextClasses);
      addClasses(timerContainer, theme.timerText);
      removeClasses(timerColon, timerColonClasses);
      addClasses(timerColon, theme.timerColon);
      
      if (isActive && !isFinished) timerColon.classList.add('animate-pulse');
      else timerColon.classList.remove('animate-pulse');

      // メッセージの動的更新
      const readingMsg = getMinuteReading(remainingMinCeil);
      let kidsMsg = "";

      if (isFinished) {
        kidsMsg = "おわり！ぴっかぴかで きもちいいね！🎉";
      } else if (!isStarted && percentage === 100) {
        kidsMsg = "じかんをえらんで「スタート」してね！";
      } else if (!isStarted) {
        kidsMsg = "おやすみちゅう...💤";
      } else if (!isActive) {
        kidsMsg = "ちょっと ストップちゅう！⏸️";
      } else {
        // 稼働中のメッセージ分岐
        if (currentMode === 'cleaning') {
          // 従来のお掃除タイマーのロジック
          if (remainingTimeMs > 7 * 60 * 1000) kidsMsg = "みんなで ピカピカに しよう！🧹✨";
          else if (remainingTimeMs > 3 * 60 * 1000) kidsMsg = `あと ${remainingMinCeil}${readingMsg}！すこし いそごう！🎒`;
          else kidsMsg = `あと ${remainingMinCeil}${readingMsg}！さいごの しあげだ！🔥`;
        } else {
          // ★「かえりのしたく」：20秒おきにメッセージをループ
          const elapsedTimeMs = Math.max(0, totalDurationMs - remainingTimeMs);
          const intervalDurationMs = isDemoMode ? (20 * 1000 / 100) : (20 * 1000);
          const messageIndex = Math.floor(elapsedTimeMs / intervalDurationMs) % leavingMessages.length;
          kidsMsg = leavingMessages[messageIndex];
        }
      }

      messageText.textContent = kidsMsg;
      removeClasses(messageText, textClasses);
      addClasses(messageText, theme.text);

      // ゾウさん or クマさんの更新
      elephantContainer.style.left = `calc(${elephantPosition}% - 2rem)`;
      elephantText.textContent = theme.character;
      
      if (isActive) {
        elephantContainer.classList.add('animate-wiggle');
        elephantContainer.classList.remove('animate-float');
        dustEffect.classList.remove('hidden');
      } else {
        elephantContainer.classList.remove('animate-wiggle');
        elephantContainer.classList.add('animate-float');
        dustEffect.classList.add('hidden');
      }

      // ゲージ更新
      progressBar.style.width = `${percentage}%`;
      removeClasses(progressBar, barClasses);
      addClasses(progressBar, theme.bar);

      // ボタン切り替え制御
      if (!isStarted) {
        btnStart.classList.remove('hidden');
        btnPause.classList.add('hidden');
        btnResume.classList.add('hidden');
        btnReset.classList.add('hidden');
        finishTimeContainer.classList.add('hidden');
      } else {
        btnStart.classList.add('hidden');
        btnReset.classList.remove('hidden');
        
        if (isActive) {
          btnPause.classList.remove('hidden');
          btnResume.classList.add('hidden');
          if (!isFinished) {
            finishTimeContainer.classList.remove('hidden');
            finishTimeText.textContent = getTargetFinishTime();
          } else {
            finishTimeContainer.classList.add('hidden');
          }
        } else {
          btnPause.classList.add('hidden');
          btnResume.classList.remove('hidden');
          finishTimeContainer.classList.add('hidden');
        }
      }
    }

    // 初期化処理の実行
    loadState();
    updateSettingUI();
    updateDividers();
    updateUI();
  </script>
</body>
</html>
